; tabs-calc — LILYGO T-Deck Max demo app (ESP32-S3, e-paper, TCA8418 keyboard)
;
; Settings mirror the official LILYGO repo (Xinyuan-LilyGO/T-Deck-MAX) so a build
; behaves exactly like their CI-tested examples. Differences:
;   * ARDUINO_USB_CDC_ON_BOOT=0  -> boots on battery without waiting for a terminal
;   * self-contained: does NOT need the LILYGO repo cloned (own pins.h)

[platformio]
default_envs = tdeck_max

[env:tdeck_max]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; --- ESP32-S3 / board config (from LILYGO boards/T-Deck-Pro.json) ---
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv   ; 16M: 3MB APP / 9.9MB FATFS
board_build.arduino.memory_type = qio_qspi  ; 8MB QSPI PSRAM (LILYGO board def)

upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; native USB (CDC+JTAG), no UART bridge chip on this board
    -DARDUINO_USB_CDC_ON_BOOT=0   ; 1 = wait for serial terminal at boot (blocks on battery)
    -DCORE_DEBUG_LEVEL=1

; GxEPD2 pinned to 1.5.5 = the version LILYGO develop against (their platformio.ini)
lib_deps =
    zinggjm/GxEPD2@1.5.5
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit TCA8418@^1.0.1
    adafruit/Adafruit BusIO@^1.14.4

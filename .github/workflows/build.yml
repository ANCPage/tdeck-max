name: build

on:
  push:
  workflow_dispatch:

jobs:
  tabs-calc-cpp:
    name: Build tabs-calc (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
          key: pio-${{ hashFiles('tabs-calc/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --quiet platformio

      - name: Build
        working-directory: tabs-calc
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabs-calc-firmware
          path: tabs-calc/.pio/build/tdeck_max/firmware.bin
          if-no-files-found: error

  tdeckmax-py:
    name: Check tdeckmax-lib (syntax + key decode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all library + app + simulator sources
        run: python3 -m compileall -q tdeckmax-lib/tdeckmax tdeckmax-lib/apps tdeckmax-lib/sim
      - name: Smoke-test key decoding (digits + letters modes)
        run: |
          python3 - <<'EOF'
          import sys; sys.path.insert(0, "tdeckmax-lib")
          from tdeckmax.keys import decode_raw
          pressed = [decode_raw(r) for r in range(129, 164)]
          assert sum(1 for k in pressed if k) == 34, "expected 34 decodable presses"
          assert all(decode_raw(r) is None for r in range(1, 36)), "releases must be ignored"
          assert decode_raw(129 + 0) == ("digit", "7")    # dialer mode: key 1 -> T9 7
          assert decode_raw(163) == ("digit", "1")        # UP dials 1
          assert decode_raw(129 + 9, letters=True) == ("char", "q")
          assert decode_raw(163, letters=True) == ("nav", "up")
          assert ("ctl", "enter") in pressed and ("ctl", "sym") in pressed and ("ctl", "alt") in pressed
          print("keys OK:", sum(1 for k in pressed if k), "presses decoded")
          EOF

      - name: Render demo screens with the host simulator
        env:
          PREVIEW_DIR: preview_out
        run: |
          pip install --quiet pillow
          python3 tdeckmax-lib/sim/preview.py

      - name: Upload screen previews
        uses: actions/upload-artifact@v4
        with:
          name: screen-previews
          path: preview_out/*.png
          if-no-files-found: error
